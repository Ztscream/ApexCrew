# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  unit-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  unit-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: make web-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/webui

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv build
      - run: docker build --tag apexcrew-executor:ci .

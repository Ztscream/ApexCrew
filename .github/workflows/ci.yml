# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  unit-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  unit-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest tests/integration tests/acceptance -q

  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: make web-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/webui

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv build
      - run: docker build --tag apexcrew-executor:ci .

  browser-quality:
    needs: [quality, unit-ubuntu, unit-windows, integration, build, pages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/check_static_replay.py

  reference-performance:
    needs: [quality, unit-ubuntu, unit-windows, integration, build, pages, browser-quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/measure_performance.py --output .tmp/reference-performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-performance-${{ github.sha }}
          path: .tmp/reference-performance.json

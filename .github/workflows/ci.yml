# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src

  unit-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  unit-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv build
      - run: docker build --tag apexcrew-executor:ci .

[project]
name = "apexcrew"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "openai>=1.0,<2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
apexcrew = "apexcrew.delivery.cli:main"

[dependency-groups]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexcrew"]

[tool.ruff]
line-length = 100
# Ruff 0.16 formats Python fences inside Markdown. This repository's PLAN.md and
# archived plans are reviewed documents whose SHA-256 and line numbers are cited
# in AGENT_LOG.md and SPEC_PROCESS.md, and SPEC.md is frozen and must never be
# normalized. The formatter owns source, never documentation.
extend-exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apexcrew"]
